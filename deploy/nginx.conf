# Face Skin AI: nginx reverse proxy with the security baseline from SECURITY.md.
#
# Install as /etc/nginx/conf.d/face-skin-ai.conf, replace app.example.com and the
# certificate paths, and run Streamlit bound to localhost ONLY:
#   streamlit run streamlit_app.py --server.address 127.0.0.1 --server.port 8501
# The header values below are copied from deploy/security_headers.json; a test
# (tests/test_deploy.py) fails if they drift apart. Verify a deployment with:
#   python scripts/check_security.py https://app.example.com
#
# NOTE: this file has not been executed in the project's test environment (nginx was not
# available there). Run `nginx -t` before reloading.

map $http_upgrade $connection_upgrade { default upgrade; "" close; }

# Per-IP limits. A per-session limit inside the app cannot stop someone opening many sessions.
limit_req_zone $binary_remote_addr zone=faceskin_pages:10m  rate=20r/s;
limit_req_zone $binary_remote_addr zone=faceskin_upload:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=faceskin_conn:10m;

server {
    listen 80;
    server_name app.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    # A little above Streamlit's maxUploadSize (15 MB) so nginx never truncates a valid upload.
    client_max_body_size 16m;
    limit_conn faceskin_conn 20;

    # --- security headers (single source: deploy/security_headers.json) ---
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-THxz9J9+wf7rhwR2YkXJoSZ13UCmYyC+3lNDv2+8ugA='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' data:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Photo uploads: tight per-IP rate.
    location /_stcore/upload_file/ {
        limit_req zone=faceskin_upload burst=5 nodelay;
        proxy_pass http://127.0.0.1:8501;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else, including the WebSocket Streamlit uses for the whole session.
    location / {
        limit_req zone=faceskin_pages burst=60 nodelay;
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
